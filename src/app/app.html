<div class="layout">

  <app-sidebar></app-sidebar>

  <div class="content">
    <router-outlet></router-outlet>
  </div>

  <!-- BOTÓN (mejor fuera del layout visual principal) -->
  <button class="search-button" (click)="openSearch()">
    Open Search
  </button>

  <!-- SEARCH CONTROLADO -->
  <app-global-search
    *ngIf="isSearchOpen"
    (close)="closeSearch()"
  ></app-global-search>

</div>
