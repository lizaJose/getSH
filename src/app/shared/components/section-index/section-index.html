<nav class="section-index" [class.section-index--grouped]="hasGroups" aria-label="Section index">
  <div class="section-index__toolbar">
    <span class="section-index__label">Browse</span>
    <div class="section-index__group-actions" *ngIf="hasGroups" role="group" aria-label="Browse groups">
      <button type="button" (click)="collapseAllGroups()">Collapse all</button>
      <button type="button" (click)="expandAllGroups()">Expand all</button>
    </div>
  </div>
  <p class="section-index__hidden-note" *ngIf="indexHidden">Index hidden — use "Expand all" to show it.</p>
  <ng-container *ngIf="!indexHidden">
  <ng-container *ngFor="let item of items; let index = index">
    <button
      *ngIf="item.group && (index === 0 || items[index - 1].group !== item.group)"
      class="section-index__group"
      [class.section-index__group--important]="groupHasImportant(item.group)"
      type="button"
      [attr.aria-expanded]="!isGroupCollapsed(item.group)"
      (click)="toggleGroup(item.group)"
    >
      <span>{{ item.group }}</span>
      <span class="section-index__important-badge" *ngIf="groupHasImportant(item.group)" title="Contains an important section">★ Important</span>
      <span class="section-index__count">{{ countGroupItems(item.group) }}</span>
      <span
        class="section-index__chevron"
        [class.section-index__chevron--collapsed]="isGroupCollapsed(item.group)"
        aria-hidden="true"
      >⌄</span>
    </button>
    <button
      *ngIf="!item.group || !isGroupCollapsed(item.group)"
      type="button"
      [class.active]="item.id === activeId"
      [class.disabled]="item.disabled"
      [class.section-index__item--nested]="!!item.group"
      [class.section-index__item--important]="item.important"
      [disabled]="item.disabled"
      [attr.aria-current]="item.id === activeId ? 'page' : null"
      (click)="sectionChange.emit(item.id)"
    >
      <span class="section-index__marker" aria-hidden="true">›</span>
      {{ item.label }}
      <span class="section-index__important-badge" *ngIf="item.important" title="Important section">★ Important</span>
    </button>
  </ng-container>
  </ng-container>
</nav>
